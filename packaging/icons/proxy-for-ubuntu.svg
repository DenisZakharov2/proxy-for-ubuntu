<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="proxy-for-ubuntu">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#g)"/>

  <!-- щит: система под защитой перехвата -->
  <path d="M64 26 L96 38 V64 c0 20-13 32-32 40 -19-8-32-20-32-40 V38 Z"
        fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round" opacity="0.95"/>

  <!-- узел входа -->
  <circle cx="64" cy="58" r="9" fill="#fff"/>
  <circle cx="64" cy="58" r="16" fill="none" stroke="#fff" stroke-width="3.5" opacity="0.5"/>

  <!-- три луча к узлу: входящий трафик -->
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M40 40 L52 50"/>
    <path d="M88 40 L76 50"/>
    <path d="M64 30 L64 42"/>
  </g>
</svg>
