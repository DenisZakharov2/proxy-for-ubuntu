name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Версия пакета, например 0.1.0
        required: true

permissions:
  contents: write

jobs:
  deb:
    name: deb (${{ matrix.target }})
    runs-on: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [ubuntu-22.04, ubuntu-24.04]
        include:
          - target: ubuntu-22.04
            rust: stable
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Установить системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Собрать .deb
        run: ./scripts/build-deb.sh --output dist --version "${{ steps.ver.outputs.version }}"

      - name: Проверить пакет
        run: |
          set -euo pipefail
          DEB=$(ls dist/*.deb | head -1)
          echo "Проверяем $DEB"
          dpkg-deb --info "$DEB"

          # ВНИМАНИЕ: список файлов извлекаем ОДИН раз в переменную.
          # `dpkg-deb --contents "$DEB" | grep -q ...` при `set -o pipefail`
          # всегда даёт ложный провал: grep завершается на первом совпадении,
          # tar ловит SIGPIPE и возвращает ненулевой код, а pipefail
          # превращает это в ошибку всего шага.
          CONTENTS="$(dpkg-deb --contents "$DEB")"

          for f in \
            usr/bin/proxy-for-ubuntu \
            usr/bin/proxy-for-ubuntud \
            usr/bin/pfu-cli \
            lib/systemd/system/proxy-for-ubuntud.service \
            lib/polkit-1/actions/com.deniszakharov.proxyforubuntu.policy \
            usr/share/applications/proxy-for-ubuntu.desktop \
            usr/share/proxy-for-ubuntu/profiles/default.yaml ; do
            if ! grep -q -- "$f" <<<"$CONTENTS"; then
              echo "НЕТ $f в пакете"
              exit 1
            fi
            echo "  ок: $f"
          done

          # Бинарники должны стартовать и печатить версию. GTK в headless
          # не откроется, поэтому проверяем демон и CLI, а не GUI.
          rm -rf _unpack && mkdir -p _unpack
          dpkg-deb -x "$DEB" _unpack
          ./_unpack/usr/bin/pfu-cli version
          ./_unpack/usr/bin/proxy-for-ubuntud --version
          echo "пакет в порядке"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.deb.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## proxy-for-ubuntu ${{ steps.ver.outputs.version }}

            Установка:
            ```bash
            sudo apt install ./proxy-for-ubuntu_${{ steps.ver.outputs.version }}_amd64.deb
            ```

            Протоколы `vless` и `vmess` реализованы, но не проверены против
            живого сервера — см. таблицу в README.
