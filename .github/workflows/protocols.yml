name: Protocols

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: protocols-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Xray не публикует официальные Docker-образы; ниже — образ сообщества,
  # закреплённый по digest, а не по тегу: тег `latest` мог смениться между
  # прогонами, и тогда «зелёная» проверка проверяла бы уже другую программу.
  # Обновление: `docker buildx imagetools inspect docker.io/teddysun/xray:latest`
  # и подставить новый Digest в строку ниже вместе с датой.
  # Закреплено 29.10.2026.
  XRAY_IMAGE: docker.io/teddysun/xray@sha256:192de11069f271816eda94840d7940fd8dcdb8a7e5d67b5e1c68ab9a3afd9ff7
  PFU_WORK: /tmp/pfu-protocols

jobs:
  check-vless-vmess:
    name: vless / vmess против живого Xray
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Подготовить рабочую директорию
        run: |
          rm -rf "${PFU_WORK}" && mkdir -p "${PFU_WORK}"

      - uses: actions/checkout@v4

      - name: Установить системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            nftables iproute2 curl gettext-base jq
          # Docker отдельно ставить не нужно: на ubuntu-22.04 раннерах
          # GitHub Actions он уже предустановлен (пакет containerd).
          # `docker.io` конфликтует с ним (containerd.io vs containerd).

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Собрать pfu-cli, daemon и прогнать unit-тесты
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all
        working-directory: app/src-tauri

      # templated Xray config (подменяется envsubst на следующем шаге)
      - name: Написать шаблон конфига Xray
        run: |
          cat > "${PFU_WORK}/xray.json.tmpl" <<'EOF'
          {
            "inbounds": [
              {
                "port": 443,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {"id": "${VLESS_UUID}", "flow": ""}
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "tcp",
                  "security": "none"
                }
              },
              {
                "port": 444,
                "protocol": "vmess",
                "settings": {
                  "clients": [
                    {"id": "${VMESS_UUID}", "alterId": 0}
                  ]
                },
                "streamSettings": {
                  "network": "tcp",
                  "security": "none"
                }
              }
            ],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF

      # ── Запускаем Xray-сервер в контейнере (inbound) ──────────────────
      - name: Запустить Xray-сервер в Docker
        run: |
          # Фиксированные UUID — тест воспроизводим между прогонами, и
          # результат можно сравнивать коммит к коммиту.
          export VLESS_UUID="b831381d-6324-4d53-ad4f-8cda48b30811"
          export VMESS_UUID="c942181d-6324-4d53-ad4f-8cda48b30822"
          envsubst < "${PFU_WORK}/xray.json.tmpl" > "${PFU_WORK}/xray.config.json"

          # Даем Docker время на инициализацию.
          for i in $(seq 1 20); do
            sudo docker info >/dev/null 2>&1 && break
            sleep 2
          done

          sudo docker run -d --name pfu-xray \
            -p 1443:443 -p 1444:444 \
            -v "${PFU_WORK}/xray.config.json:/etc/xray/config.json:ro" \
            "${XRAY_IMAGE}" || true

          # Ждём, пока Xray поднимет порты.
          for i in $(seq 1 30); do
            if sudo docker port pfu-xray 2>/dev/null | grep -q 1443; then
              echo "Xray vless inbound готов"
              break
            fi
            sleep 1
          done
          sudo docker logs pfu-xray 2>&1 | tail -30 || true
          echo "проброшенные порты:"
          sudo docker port pfu-xray

      # ── Пишем клиентскую конфигурацию proxy-for-ubuntu ────────────────
      - name: Сгенерировать конфиг pfu для vless/vmess
        run: |
          cat > "${PFU_WORK}/config.yaml" <<'EOF'
          api: 1
          outbounds:
            - {name: DIRECT, type: direct}
            - {name: VLESS-Test, type: vless, server: 127.0.0.1, port: 1443,
               uuid: "b831381d-6324-4d53-ad4f-8cda48b30811",
               tls: false, network: tcp, flow: "", udp: false,
               skip_cert_verify: true}
            - {name: VMESS-Test, type: vmess, server: 127.0.0.1, port: 1444,
               uuid: "c942181d-6324-4d53-ad4f-8cda48b30822",
               tls: false, network: tcp, alter_id: 0,
               skip_cert_verify: true, udp: false}
          intercept:
            tcp: redirect
            udp: tproxy
            exclude_ports: ["22"]
            bypass_private: true
          rules:
            - DOMAIN,example.com,VLESS-Test
            - DOMAIN,vmess.example.com,VMESS-Test
            - MATCH,DIRECT
          final: DIRECT
          EOF

      # ── Валидируем конфиг через pfu-cli (без root и без демона) ───
      # `pfu-cli validate` читает YAML из stdin и возвращает код 0/1 — как
      # `nginx -t`. `apply` требует root, nftables и запущенный демон, в
      # Actions его не прогоняем.
      - name: Валидация конфига pfu-cli
        working-directory: app/src-tauri
        run: cargo run --bin pfu-cli -- validate < "${PFU_WORK}/config.yaml"

      # ── Проверяем vless: настоящий HTTP-запрос через наш outbound ──────
      # Раньше здесь открывался TCP до порта Xray мимо нашего кода — такой шаг
      # зелёный даже при полностью сломанном vless. Теперь запрос уходит через
      # `engine::outbound` и обязан вернуться ответом 2xx–3xx.
      - name: Проверить vless через наш outbound
        working-directory: app/src-tauri
        run: |
          rc=0
          cargo run --bin pfu-cli -- test-outbound \
            --config "${PFU_WORK}/config.yaml" \
            --name VLESS-Test \
            --url http://example.com/ \
            --timeout-ms 15000 \
            > "${PFU_WORK}/vless.json" || rc=$?
          cat "${PFU_WORK}/vless.json" || true
          exit $rc

      # ── Проверяем vmess тем же путём ──────────────────────────────────
      - name: Проверить vmess через наш outbound
        working-directory: app/src-tauri
        run: |
          rc=0
          cargo run --bin pfu-cli -- test-outbound \
            --config "${PFU_WORK}/config.yaml" \
            --name VMESS-Test \
            --url http://example.com/ \
            --timeout-ms 15000 \
            > "${PFU_WORK}/vmess.json" || rc=$?
          cat "${PFU_WORK}/vmess.json" || true
          exit $rc

      # ── Итоговый verdict: матрица из фактических JSON-ответов ─────────
      - name: Зафиксировать вердикт совместимости
        if: always()
        run: |
          echo "## Результат проверки протоколов" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Протокол | Образ Xray | HTTP | Байт | мс | Вердикт |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for name in vless vmess; do
            file="${PFU_WORK}/${name}.json"
            if [ -s "$file" ]; then
              ok=$(jq -r '.ok // false' "$file")
              code=$(jq -r '.status // "—"' "$file")
              bytes=$(jq -r '.bytes // 0' "$file")
              ms=$(jq -r '.latency_ms // 0' "$file")
              err=$(jq -r '.error // ""' "$file")
              if [ "$ok" = "true" ]; then
                verdict="✅ HTTP-ответ получен"
              else
                verdict="❌ ${err:-нет ответа}"
              fi
            else
              code="—"; bytes=0; ms=0; verdict="❌ шаг не выполнился"
            fi
            echo "| ${name} | ${XRAY_IMAGE} | ${code} | ${bytes} | ${ms} | ${verdict} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Проверка идёт через наш код: `pfu-cli test-outbound` отправляет GET через `engine::outbound` и требует ответ 2xx–3xx. `sudo` и `nftables` нужны только для `apply`, поэтому перехват системы в Actions не проверяется — это отдельная job на netns-стенде (`TASK-012`).' >> "$GITHUB_STEP_SUMMARY"

      - name: Остановить Xray-контейнер
        if: always()
        run: |
          sudo docker stop pfu-xray 2>/dev/null || true
          sudo docker rm pfu-xray 2>/dev/null || true
