[package]
name = "proxy-for-ubuntu"
version = "0.1.0"
description = "System-wide proxy routing for Ubuntu: transparent TCP/UDP interception with Clash-style rules"
authors = ["Denis Zakharov <deniszakharov@msn.com>"]
license = "MIT"
repository = "https://github.com/DenisZakharov2/proxy-for-ubuntu"
edition = "2021"
rust-version = "1.77"
default-run = "proxy-for-ubuntu"

[lib]
name = "pfu"
path = "src/lib.rs"

[[bin]]
name = "proxy-for-ubuntu"
path = "src/bin/gui.rs"

[[bin]]
name = "proxy-for-ubuntud"
path = "src/bin/daemon.rs"

[[bin]]
name = "pfu-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- GUI ---
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"

# --- сериализация ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# --- асинхронность ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "net"] }
futures = "0.3"
async-trait = "0.1"

# --- ошибки и логи ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# --- утилиты ---
bytes = "1"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "5"
regex = "1"
ipnet = "2"
crc32fast = "1"
flate2 = "1"
url = "2"
percent-encoding = "2"

# --- криптография (только проверенные crates) ---
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
curve25519-dalek = "4"
rand_core = "0.6"

# --- TLS ---
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
rustls-pemfile = "2"

# --- система ---
libc = "0.2"
nix = { version = "0.29", features = ["net", "fs", "process", "signal", "user"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
